services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      MATCHING_ENGINE: '${MATCHING_ENGINE:-price-tree}'
      ENABLE_DEMO_LIQUIDITY: '${ENABLE_DEMO_LIQUIDITY:-true}'
      SESSION_TTL_MS: '${SESSION_TTL_MS:-86400000}'
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:${APP_PORT:-3000},http://127.0.0.1:${APP_PORT:-3000}}'
    stop_grace_period: 15s
